<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 240" width="1300" height="240" fill="none">
  <!-- Background -->
  <rect width="1300" height="240" fill="#ffffff"/>

  <!-- ============================================ -->
  <!-- ICON — Dubai skyline + ascending chart line -->
  <!-- ============================================ -->
  <g transform="translate(30, 20)">
    <!-- Base platform -->
    <rect x="0" y="195" width="330" height="10" rx="2" fill="#000000"/>

    <!-- Building 1 — short -->
    <rect x="10" y="145" width="30" height="50" fill="#000000"/>
    <rect x="17" y="133" width="16" height="12" fill="#000000"/>

    <!-- Building 2 — angled top -->
    <polygon points="55,195 55,125 70,103 95,125 95,195" fill="#000000"/>

    <!-- Building 3 — Burj Khalifa -->
    <rect x="115" y="75" width="42" height="120" fill="#000000"/>
    <polygon points="115,75 136,13 157,75" fill="#000000"/>
    <rect x="134" y="0" width="4" height="13" fill="#000000"/>

    <!-- Building 4 — medium -->
    <rect x="170" y="95" width="40" height="100" fill="#000000"/>
    <rect x="184" y="80" width="12" height="15" fill="#000000"/>

    <!-- Building 5 — short -->
    <rect x="222" y="135" width="30" height="60" fill="#000000"/>
    <rect x="228" y="123" width="18" height="12" fill="#000000"/>

    <!-- Building 6 — medium -->
    <rect x="265" y="115" width="35" height="80" fill="#000000"/>

    <!-- Chart line — UAE green, rising -->
    <polyline
      points="15,180 75,150 140,130 205,105 265,75"
      stroke="#00732F"
      stroke-width="9"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"/>

    <!-- Data points -->
    <circle cx="15" cy="180" r="7" fill="#00732F"/>
    <circle cx="75" cy="150" r="7" fill="#00732F"/>
    <circle cx="140" cy="130" r="7" fill="#00732F"/>
    <circle cx="205" cy="105" r="7" fill="#00732F"/>

    <!-- Arrow head — UAE dark red -->
    <polygon points="310,35 277,88 253,62" fill="#C8102E"/>
  </g>

  <!-- ============================================ -->
  <!-- TEXT — DPI wordmark + full name              -->
  <!-- ============================================ -->
  <g transform="translate(410, 0)">
    <!-- DPI — main wordmark -->
    <text x="0" y="140"
      font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif"
      font-size="140"
      font-weight="800"
      fill="#000000"
      letter-spacing="-3">DPI</text>

    <!-- Full name -->
    <text x="6" y="205"
      font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif"
      font-size="34"
      font-weight="700"
      fill="#404040"
      letter-spacing="1.5">DUBAI PROPERTY INTELLIGENCE</text>
  </g>
</svg>
